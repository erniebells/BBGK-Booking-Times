services:
  db:
    image: postgres:16-alpine
    container_name: boggoms-golf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: golfclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: boggoms_golf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - golf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golfclub -d boggoms_golf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boggoms-golf-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgresql://golfclub:${POSTGRES_PASSWORD}@db:5432/boggoms_golf
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - golf-network

volumes:
  postgres_data:
    driver: local

networks:
  golf-network:
    driver: bridge
