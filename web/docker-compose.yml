services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: golf
      POSTGRES_PASSWORD: golf
      POSTGRES_DB: golf_tee
    ports:
      - "5432:5432"
    volumes:
      - golf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golf -d golf_tee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  golf_pg_data:
