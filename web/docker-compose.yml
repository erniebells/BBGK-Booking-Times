services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: golf
      POSTGRES_PASSWORD: golf
      POSTGRES_DB: golf_tee
    ports:
      - "5432:5432"
    volumes:
      - golf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golf -d golf_tee"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://golf:golf@db:5432/golf_tee
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    # Reach published Postgres via the host when container-to-container
    # bridge L2 is unavailable (keeps hostname `db` in DATABASE_URL).
    extra_hosts:
      - "db:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  golf_pg_data:
